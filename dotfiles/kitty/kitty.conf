# font
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
disable_ligatures cursor

# color theme
# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# 
# Catppuccin-Latte
# include latte-theme.conf

background_blur 40
dynamic_background_opacity yes

# iPhone-inspired glass surface for Wayland compositors that support blur.
window_padding_width 8 12
single_window_padding_width 8 12
hide_window_decorations yes
draw_minimal_borders yes
draw_window_borders_for_single_window no
window_border_width 0
active_border_color #89dceb
inactive_border_color #45475a
bell_border_color #cba6f7
inactive_text_alpha 0.86

# Keep the default background from the selected theme while making it a soft glass surface.
background_opacity 0.72
# END_KITTY_THEME

# tab bar
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Keep the tab strip understated; the compositor focus ring provides the outer accent.
active_tab_foreground       #1e1e2e
active_tab_background       #89dceb
inactive_tab_foreground     #cdd6f4
inactive_tab_background     #313244
tab_bar_background          #1e2030

# Glass-friendly text accents.
selection_foreground        #1e1e2e
selection_background        #89b4fa
cursor                      #cba6f7
cursor_text_color           #1e1e2e
url_color                   #89dceb

# cursor trail
cursor_trail 3
