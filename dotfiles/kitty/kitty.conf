# font
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
disable_ligatures cursor

# color theme
# BEGIN_KITTY_THEME
# Catppuccin-Latte
include latte-theme.conf

background_blur 40
dynamic_background_opacity yes

# Light glass surface for Wayland compositors that support blur.
window_padding_width 8 12
single_window_padding_width 8 12
hide_window_decorations yes
draw_minimal_borders yes
draw_window_borders_for_single_window no
window_border_width 0
active_border_color #7287fd
inactive_border_color #9ca0b0
bell_border_color #df8e1d
inactive_text_alpha 0.72

# Keep the default background from the selected theme while making it a soft glass surface.
background_opacity 0.72
# END_KITTY_THEME

# tab bar
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Keep the tab strip understated; the compositor focus ring provides the outer accent.
active_tab_foreground       #ffffff
active_tab_background       #0A84FF
inactive_tab_foreground     #6c6f85
inactive_tab_background     #dce0e8
tab_bar_background          #e6e9ef

# Glass-friendly text accents.
selection_foreground        #ffffff
selection_background        #0A84FF
cursor                      #0A84FF
cursor_text_color           #ffffff
url_color                   #1e66f5

# cursor trail
cursor_trail 3
